<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2b4d"/>
      <stop offset="0.5" stop-color="#061b32"/>
      <stop offset="1" stop-color="#030f1e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.15" r="0.7">
      <stop offset="0" stop-color="#e9a3ed" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#e9a3ed" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#e9a3ed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3b9f0"/>
      <stop offset="1" stop-color="#d957c6"/>
    </linearGradient>
    <linearGradient id="shieldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e3157" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#071f3a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>

  <!-- faint background rule lines (precedence chain motif) -->
  <g stroke="#2f81f7" stroke-opacity="0.05" stroke-width="2">
    <line x1="900" y1="120" x2="1520" y2="120"/>
    <line x1="900" y1="180" x2="1420" y2="180"/>
    <line x1="900" y1="240" x2="1500" y2="240"/>
    <line x1="900" y1="880" x2="1460" y2="880"/>
    <line x1="900" y1="820" x2="1360" y2="820"/>
  </g>

  <!-- ===== badge (shield mark) ===== -->
  <g transform="translate(120,330) scale(0.66)">
    <rect x="0" y="0" width="512" height="512" rx="116" fill="#071f3a"/>
    <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#glow)"/>
    <rect x="2" y="2" width="508" height="508" rx="114" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
    <path d="M256 92 L366 132 Q380 137 380 152 L380 268 C380 346 330 396 256 430 C182 396 132 346 132 268 L132 152 Q132 137 146 132 Z"
          fill="url(#shieldFill)" stroke="url(#shieldStroke)" stroke-width="12" stroke-linejoin="round"/>
    <polyline points="214,176 262,216 214,256" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="276" y1="258" x2="324" y2="258" stroke="#e9a3ed" stroke-width="22" stroke-linecap="round"/>
    <circle cx="212" cy="332" r="15" fill="#f85149"/>
    <circle cx="256" cy="332" r="15" fill="#d29922"/>
    <circle cx="300" cy="332" r="15" fill="#2ea043"/>
  </g>

  <!-- ===== text block ===== -->
  <text x="560" y="388" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="82" font-weight="bold" fill="#ffffff">Agent CLI Permissions</text>
  <text x="562" y="452" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="35" fill="#9fb3c8">Two-tier permission governance for AI coding agents</text>

  <!-- precedence chain: DENY &gt; ASK &gt; ALLOW -->
  <g font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="34" font-weight="bold">
    <rect x="562" y="528" width="176" height="72" rx="36" fill="#f85149" fill-opacity="0.14" stroke="#f85149" stroke-width="2.5"/>
    <text x="650" y="575" fill="#ff8b85" text-anchor="middle">DENY</text>
    <text x="766" y="576" fill="#5b7088" font-size="40">&gt;</text>

    <rect x="806" y="528" width="150" height="72" rx="36" fill="#d29922" fill-opacity="0.14" stroke="#d29922" stroke-width="2.5"/>
    <text x="881" y="575" fill="#f0c061" text-anchor="middle">ASK</text>
    <text x="984" y="576" fill="#5b7088" font-size="40">&gt;</text>

    <rect x="1024" y="528" width="192" height="72" rx="36" fill="#2ea043" fill-opacity="0.14" stroke="#2ea043" stroke-width="2.5"/>
    <text x="1120" y="575" fill="#5ad67d" text-anchor="middle">ALLOW</text>
  </g>

  <!-- agent target chips -->
  <g font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="27" fill="#9fb3c8">
    <rect x="562" y="672" width="196" height="60" rx="30" fill="#0e2b4d" stroke="#2f4a6b" stroke-width="2"/>
    <text x="660" y="711" text-anchor="middle">Claude Code</text>
    <rect x="776" y="672" width="128" height="60" rx="30" fill="#0e2b4d" stroke="#2f4a6b" stroke-width="2"/>
    <text x="840" y="711" text-anchor="middle">Codex</text>
    <rect x="922" y="672" width="208" height="60" rx="30" fill="#0e2b4d" stroke="#2f4a6b" stroke-width="2"/>
    <text x="1026" y="711" text-anchor="middle">Antigravity</text>
    <rect x="1148" y="672" width="132" height="60" rx="30" fill="#0e2b4d" stroke="#2f4a6b" stroke-width="2"/>
    <text x="1214" y="711" text-anchor="middle">Cursor</text>
    <rect x="1298" y="672" width="176" height="60" rx="30" fill="#0e2b4d" stroke="#2f4a6b" stroke-width="2"/>
    <text x="1386" y="711" text-anchor="middle">OpenCode</text>
  </g>
</svg>

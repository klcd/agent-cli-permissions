  <text x="156" y="108" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="bold" fill="#cdd9e5" letter-spacing="1">AGENT CLI PERMISSIONS</text>

  <text x="88" y="320" font-family="DejaVu Sans, sans-serif" font-size="50" font-weight="bold" fill="#ffffff">See every rule</text>
  <text x="88" y="382" font-family="DejaVu Sans, sans-serif" font-size="50" font-weight="bold" fill="#ffffff">at a glance</text>


<body>
<div class="container">
  <div class="header">
    <div class="header-top">
      <div class="title">
        <span>Agent CLI Permissions</span>
        <span id="syncBadge" class="badge neutral">Checking...</span>
      </div>
      <div style="display:flex;align-items:center;gap:6px;">
        <button id="syncBtn" class="primary" title="Sync canonical ~/.agents/permissions/*.yml rules to Claude, Codex, and Antigravity">Sync Rules</button>
        <button id="refreshBtn" title="Reload active project &amp; CLI permission groups">Refresh</button>
      </div>
    </div>
    <div id="syncStatusNotice" class="eval-result" style="display:none;"></div>
    <div id="contextBanner" class="grid-2" style="margin-top:2px;">
      <div class="stat-box" id="projectStatBox" style="flex-direction:row;justify-content:space-between;align-items:center;padding:7px 10px;">
        <div style="display:flex;flex-direction:column;gap:1px;min-width:0;">
          <span class="sub" style="font-size:10px;">Project</span>
          <strong id="projectLabel" class="mono" style="font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">Detecting...</strong>
        </div>
        <span id="branchBadge" class="badge neutral">&mdash;</span>
      </div>
      <div class="stat-box" style="flex-direction:row;justify-content:space-between;align-items:center;padding:7px 10px;">
        <div style="display:flex;flex-direction:column;gap:1px;min-width:0;">
          <span class="sub" style="font-size:10px;">CLI Rules</span>
          <strong id="cliCountLabel" class="mono" style="font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">0 rules</strong>
        </div>
        <span id="agentStateBadge" class="badge allow">DENY &gt; ASK &gt; ALLOW</span>
      </div>
    </div>
  </div>

  <!-- Interactive CLI Command Permission Evaluator -->
  <div class="card" style="padding:8px 10px;gap:6px;">
    <div class="card-title">
      <span>Check CLI Permission</span>
    </div>
    <div class="tester-box">
      <input id="cmdInput" type="text" class="mono" placeholder="Enter CLI command (e.g. git status, rm -rf /, orca)..." />
      <button id="testBtn" class="primary" title="Evaluate command against DENY &gt; ASK &gt; ALLOW permission rules">Check</button>
    </div>
    <div id="evalOutput" style="display:none;" class="eval-result"></div>
  </div>

  <div id="tabContent"></div>
  <div id="orcaTooltip" class="orca-tooltip" style="display:none;"></div>
</div>
<script>
(() => {
  // orca-plugin/src/panel/state.ts
  var panelState = {
    currentReport: null,
    doctorReport: null,
    runningDoctor: false,
    activeTab: "egress",
    searchFilter: "",
    actionFilter: "all",
    egressSearch: "",
    togglingSandbox: false,
    lastL7Suggestion: null,
    openApps: new Set,
    openCliRules: new Set,
    openEgress: new Set,
    openSections: new Set,
    openSystemItems: new Set
  };

  // orca-plugin/src/panel/utils.ts
  function escapeHtml(str) {
    return String(str ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  async function copyText(text, btn) {
    try {
      await navigator.clipboard.writeText(text);
      if (btn) {
        const prev = btn.textContent;
        btn.textContent = "Copied";
        setTimeout(() => {
          btn.textContent = prev;
        }, 1000);
      }
    } catch {
    }
  }

  // orca-plugin/src/panel/views/cli-tab.ts
  function renderCliTab() {
    const report = panelState.currentReport;
    if (!report)
      return "";
    const selectedAgent = report.currentAgent;
    const filteredRules = report.allCliRules.filter((r) => {
      if (!r.compatibleAgents.includes(selectedAgent))
        return false;
      if (panelState.actionFilter !== "all" && r.action !== panelState.actionFilter)
        return false;
      if (!panelState.searchFilter)
        return true;
      const q = panelState.searchFilter.toLowerCase();
      return r.cliCommand.toLowerCase().includes(q) || r.baseBinary.toLowerCase().includes(q) || r.raw.toLowerCase().includes(q) || r.groupName.toLowerCase().includes(q);
    });
    const byApp = new Map;
    for (const r of filteredRules) {
      const appKey = r.baseBinary || r.tool || "other";
      if (!byApp.has(appKey))
        byApp.set(appKey, []);
      byApp.get(appKey).push(r);
    }
    const sortedApps = [...byApp.entries()].sort((a, b) => a[0].localeCompare(b[0]));
    const appsHtml = sortedApps.map(([appName, rules]) => {
      const allowCount = rules.filter((r) => r.action === "allow").length;
      const askCount = rules.filter((r) => r.action === "ask").length;
      const denyCount = rules.filter((r) => r.action === "deny").length;
      const sources = [...new Set(rules.map((r) => r.groupName))].join(", ");
      const isOpen = Boolean(panelState.searchFilter) || panelState.openApps.has(appName);
      const appDotClass = denyCount > 0 && allowCount === 0 ? "deny" : askCount > 0 && allowCount === 0 ? "l7" : "rw";
      const rows = rules.map((r) => {
        const dotClass = r.action === "deny" ? "deny" : r.action === "ask" ? "l7" : "rw";
        const cleanCmd = r.cliCommand.replace(/\s*\[args\.\.\.\]/, "");
        const scopePath = r.scope === "global" ? `~/.agents/permissions/${r.sourceFile}` : `.agents/permissions/${r.sourceFile}`;
        const tooltipLines = [
          `${r.action.toUpperCase()} \u2022 ${r.raw}`,
          `Policy: ${r.groupName} (${scopePath})`,
          ...r.groupDescription ? [r.groupDescription] : []
        ];
        const tooltip = tooltipLines.join("\n");
        return `
            <div class="cmd-row" data-tooltip="${escapeHtml(tooltip)}">
              <div style="display:flex;align-items:center;gap:8px;min-width:0;flex:1;">
                <span class="access-dot ${dotClass}"></span>
                <span class="cmd-code" style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(r.cliCommand)}</span>
              </div>
              <div style="display:flex;align-items:center;gap:4px;flex-shrink:0;">
                <span class="source-pill" data-tooltip="${escapeHtml(tooltip)}">&#8984; ${escapeHtml(r.groupName)}</span>
              </div>
            </div>
          `;
      }).join("");
      return `
        <details class="app-fold" data-app="${escapeHtml(appName)}" ${isOpen ? "open" : ""}>
          <summary>
            <div style="display:flex;align-items:center;gap:8px;min-width:0;flex:1;">
              <span class="fold-chevron">&#9654;</span>
              <span class="access-dot ${appDotClass}"></span>
              <code class="mono" style="font-size:12px;font-weight:700;">${escapeHtml(appName)}</code>
              <span class="sub" style="font-weight:400;">(${rules.length})</span>
            </div>
            <div style="display:flex;gap:4px;align-items:center;flex-shrink:0;">
              <span class="source-pill">&#8984; ${escapeHtml(sources)}</span>
            </div>
          </summary>
          <div class="app-fold-body">
            ${rows}
          </div>
        </details>
      `;
    }).join("");
    return `
    <div class="controls">
      <input id="ruleSearch" type="text" placeholder="Filter CLI command (e.g. git, docker, kubectl, orca)..." value="${escapeHtml(panelState.searchFilter)}" />
      <select id="actionSelect" style="max-width:105px;">
        <option value="all" ${panelState.actionFilter === "all" ? "selected" : ""}>All</option>
        <option value="allow" ${panelState.actionFilter === "allow" ? "selected" : ""}>Allow</option>
        <option value="ask" ${panelState.actionFilter === "ask" ? "selected" : ""}>Ask</option>
        <option value="deny" ${panelState.actionFilter === "deny" ? "selected" : ""}>Deny</option>
      </select>
      <button id="expandAllBtn" class="copy-btn">Expand</button>
      <button id="collapseAllBtn" class="copy-btn">Collapse</button>
    </div>
    ${appsHtml || '<div class="card"><div class="sub">No matching CLI permission rules found.</div></div>'}
  `;
  }

  // orca-plugin/src/panel/main.ts
  function getInputValue(id) {
    const el = document.getElementById(id);
    return el ? el.value : "";
  }
  function renderHeader() {
    const report = panelState.currentReport;
    if (!report)
      return;
    const ws = report.selectedWorkspace;
    const projLabel = document.getElementById("projectLabel");
    if (projLabel)
      projLabel.textContent = ws.name;
    const projBox = document.getElementById("projectStatBox");
    if (projBox)
      projBox.title = ws.path;
    const branchBadge = document.getElementById("branchBadge");
    if (branchBadge)
      branchBadge.textContent = ws.branch || "main";
    const agentRules = report.allCliRules.filter((r) => r.compatibleAgents.includes(report.currentAgent));
    const cliCountLabel = document.getElementById("cliCountLabel");
    if (cliCountLabel) {
      const allowCount = agentRules.filter((r) => r.action === "allow").length;
      const denyCount = agentRules.filter((r) => r.action === "deny").length;
      cliCountLabel.textContent = `${agentRules.length} (${allowCount} allow / ${denyCount} deny)`;
    }
    const syncBadge = document.getElementById("syncBadge");
    if (syncBadge) {
      const ns = report.nativeSync;
      const syncedCount = (ns?.claudeSynced ? 1 : 0) + (ns?.codexSynced ? 1 : 0) + (ns?.geminiSynced ? 1 : 0);
      if (syncedCount >= 2) {
        syncBadge.className = "badge allow";
        syncBadge.textContent = "Synced";
        syncBadge.title = "Canonical ~/.agents/permissions/*.yml rules synced to native agent configs";
      } else {
        syncBadge.className = "badge neutral";
        syncBadge.textContent = `${report.permissionGroups.length} groups`;
        syncBadge.title = "Loaded permission groups from ~/.agents/permissions/*.yml";
      }
    }
  }
  async function runPermissionCheck(command) {
    const report = panelState.currentReport;
    const trimmed = command.trim();
    if (!trimmed || !report)
      return;
    const box = document.getElementById("evalOutput");
    if (!box)
      return;
    try {
      const res = await window.orca.plugin.request("evaluateCommand", {
        command: trimmed,
        workspacePath: report.selectedWorkspace.path,
        agent: report.currentAgent
      });
      box.style.display = "flex";
      const dotClassForAction = (act) => act === "allow" || act === "pass" ? "rw" : act === "ask" || act === "warn" ? "l7" : "deny";
      const verdictDot = dotClassForAction(res.verdict);
      const rulesHtml = (res.matchedRules || []).map((r) => {
        const rDot = dotClassForAction(r.action);
        return `<div class="cmd-meta" style="align-items:center;"><span class="access-dot ${rDot}"></span><span class="mono" style="color:var(--fg);font-weight:600;">${escapeHtml(r.cliCommand)}</span><span class="source-pill">&#8984; ${escapeHtml(r.groupName)} (${escapeHtml(r.sourceFile)})</span></div>`;
      }).join("");
      box.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;">
        <div style="display:flex;align-items:center;gap:7px;min-width:0;">
          <span class="access-dot ${verdictDot}"></span>
          <span class="mono" style="font-weight:600;color:var(--fg);">${escapeHtml(res.command)}</span>
        </div>
        <span class="source-pill">${escapeHtml(res.verdict.toUpperCase())}</span>
      </div>
      <div class="sub">${escapeHtml(res.summary)}</div>
      ${rulesHtml}
    `;
    } catch (err) {
      box.style.display = "flex";
      box.innerHTML = `<div style="display:flex;align-items:center;gap:6px;"><span class="access-dot deny"></span><div>${escapeHtml(err?.message || err)}</div></div>`;
    }
  }
  function renderPermissionsView() {
    if (!panelState.currentReport)
      return;
    const container = document.getElementById("tabContent");
    if (!container)
      return;
    container.innerHTML = renderCliTab();
    container.querySelectorAll("details.app-fold").forEach((el) => {
      el.addEventListener("toggle", () => {
        const app = el.dataset.app;
        if (app) {
          if (el.open)
            panelState.openApps.add(app);
          else
            panelState.openApps.delete(app);
        }
      });
    });
    document.getElementById("expandAllBtn")?.addEventListener("click", () => {
      container.querySelectorAll("details.app-fold").forEach((el) => {
        el.open = true;
        if (el.dataset.app)
          panelState.openApps.add(el.dataset.app);
      });
    });
    document.getElementById("collapseAllBtn")?.addEventListener("click", () => {
      panelState.openApps.clear();
      container.querySelectorAll("details.app-fold").forEach((el) => {
        el.open = false;
      });
    });
    document.getElementById("ruleSearch")?.addEventListener("input", (e) => {
      panelState.searchFilter = e.target.value;
      renderPermissionsView();
      const input = document.getElementById("ruleSearch");
      if (input) {
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
      }
    });
    document.getElementById("actionSelect")?.addEventListener("change", (e) => {
      panelState.actionFilter = e.target.value;
      renderPermissionsView();
    });
  }
  async function loadReport() {
    try {
      const res = await window.orca.plugin.request("getPolicyReport", {});
      panelState.currentReport = res;
      renderHeader();
      if (document.activeElement?.id !== "ruleSearch") {
        renderPermissionsView();
      }
    } catch (err) {
      const container = document.getElementById("tabContent");
      if (container) {
        container.innerHTML = `<div class="card"><span class="badge deny">Error</span><div class="mono">${escapeHtml(err?.message || err)}</div></div>`;
      }
    }
  }
  function bootstrapPanel() {
    document.addEventListener("click", (e) => {
      const target = e.target;
      if (!(target instanceof HTMLElement))
        return;
      if (target.dataset.copy) {
        copyText(target.dataset.copy, target);
      }
    });
    document.getElementById("refreshBtn")?.addEventListener("click", () => {
      loadReport();
    });
    document.getElementById("syncBtn")?.addEventListener("click", async () => {
      const syncBtn = document.getElementById("syncBtn");
      const notice = document.getElementById("syncStatusNotice");
      if (syncBtn) {
        syncBtn.disabled = true;
        syncBtn.textContent = "Syncing...";
      }
      try {
        const report = panelState.currentReport;
        const res = await window.orca.plugin.request("syncPermissions", {
          workspacePath: report?.selectedWorkspace?.path
        });
        if (notice) {
          notice.style.display = "flex";
          notice.innerHTML = `<div style="display:flex;align-items:center;gap:6px;"><span class="badge ${res.ok ? "allow" : "deny"}">${res.ok ? "SYNCED" : "ERROR"}</span><span class="sub">${escapeHtml(res.message)}</span></div>`;
        }
        if (res.report) {
          panelState.currentReport = res.report;
          renderHeader();
          renderPermissionsView();
        }
      } catch (err) {
        if (notice) {
          notice.style.display = "flex";
          notice.innerHTML = `<div style="display:flex;align-items:center;gap:6px;"><span class="badge deny">ERROR</span><span class="sub">${escapeHtml(err?.message || err)}</span></div>`;
        }
      } finally {
        if (syncBtn) {
          syncBtn.disabled = false;
          syncBtn.textContent = "Sync Rules";
        }
      }
    });
    document.getElementById("testBtn")?.addEventListener("click", () => {
      runPermissionCheck(getInputValue("cmdInput"));
    });
    document.getElementById("cmdInput")?.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        runPermissionCheck(e.target.value);
      }
    });
    const tooltipEl = document.getElementById("orcaTooltip");
    const positionTooltip = (clientX, clientY) => {
      if (!tooltipEl || tooltipEl.style.display === "none")
        return;
      const pad = 10;
      const rect = tooltipEl.getBoundingClientRect();
      let left = clientX + 12;
      let top = clientY + 14;
      if (left + rect.width > window.innerWidth - pad) {
        left = Math.max(pad, window.innerWidth - rect.width - pad);
      }
      if (top + rect.height > window.innerHeight - pad) {
        top = Math.max(pad, clientY - rect.height - 10);
      }
      tooltipEl.style.left = `${left}px`;
      tooltipEl.style.top = `${top}px`;
    };
    document.addEventListener("mouseover", (e) => {
      if (!tooltipEl)
        return;
      const target = e.target;
      if (!(target instanceof HTMLElement))
        return;
      const host = target.closest("[data-tooltip]");
      if (!host) {
        tooltipEl.style.display = "none";
        return;
      }
      const text = host.dataset.tooltip?.trim();
      if (!text) {
        tooltipEl.style.display = "none";
        return;
      }
      tooltipEl.textContent = text;
      tooltipEl.style.display = "block";
      positionTooltip(e.clientX, e.clientY);
    });
    document.addEventListener("mousemove", (e) => {
      positionTooltip(e.clientX, e.clientY);
    });
    document.addEventListener("mouseout", (e) => {
      if (!tooltipEl)
        return;
      const related = e.relatedTarget;
      if (!(related instanceof HTMLElement) || !related.closest("[data-tooltip]")) {
        tooltipEl.style.display = "none";
      }
    });
    window.addEventListener("scroll", () => {
      if (tooltipEl)
        tooltipEl.style.display = "none";
    }, true);
    window.addEventListener("focus", () => {
      loadReport();
    });
    loadReport();
  }
  bootstrapPanel();
})();
</script>
</body>
</html>

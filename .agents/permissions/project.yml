name: project
description: Project-specific permissions for permission-setup repository with argument patterns
allow:
  # CLI & task execution
  - "Bash(npx agent-cli-permissions)"
  - "Bash(npx agent-cli-permissions:*)"
  - "Bash(npx agent-permissions)"
  - "Bash(npx agent-permissions:*)"
  - "Bash(npx .)"
  - "Bash(npx .:*)"
  - "Bash(agent-cli-permissions)"
  - "Bash(agent-cli-permissions:*)"
  - "Bash(agent-permissions)"
  - "Bash(agent-permissions:*)"
  - "Bash(./bin/agent-cli-permissions)"
  - "Bash(./bin/agent-cli-permissions:*)"
  - "Bash(./bin/agent-permissions)"
  - "Bash(./bin/agent-permissions:*)"
  - "Bash(node bin/agent-permissions.mjs)"
  - "Bash(node bin/agent-permissions.mjs:*)"
  - "Bash(node src/sync-permissions.mjs)"
  - "Bash(node src/sync-permissions.mjs:*)"
  - "Bash(npm run check)"
  - "Bash(npm run sync)"
  - "Bash(npm run test)"
  - "Bash(npm run test:*)"
  - "Bash(npm test)"
  - "Bash(npm test:*)"
  - "Bash(node --test)"
  - "Bash(node --test:*)"

  # Safe local Git staging and branch operations
  - "Bash(git add:*)"
  - "Bash(git checkout:*)"
  - "Bash(git commit:*)"
  - "Bash(git restore:*)"
  - "Bash(git stash)"
  - "Bash(git stash:*)"
  - "Bash(git switch:*)"
  - "Bash(git merge --abort)"
  - "Bash(git rebase --abort)"
  - "Bash(git cherry-pick --abort)"

name: Validate Agent Permissions

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Verify Canonical Policies & Generated Rules
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Verify Generated Files Are In Sync (No Drift)
        run: node scripts/sync-permissions.mjs --check

      - name: Run Deterministic Policy Test Suite
        run: node --test tests/permissions.test.mjs
